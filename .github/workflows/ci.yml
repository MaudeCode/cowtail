name: CI

# CI.md in MaudeCode/.github: the router selects the suites a change reaches from .github/ci-suites.json, each suite
# runs its verify workflow, and CI Gate, a required check, passes when every selected suite passed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to main queues behind the one before it. Every other run stands alone: a pull request's first attempt
  # cancels the runs it replaces in `supersede`, and never waits for them to stop.
  group: >-
    ci-${{ github.event_name == 'push' && github.run_attempt == '1' && github.ref
    || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  supersede:
    name: Supersede
    if: github.event_name == 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true # a fork's token cannot cancel
    permissions:
      actions: write
    steps:
      - name: Cancel this pull request's older runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          workflow="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id)"
          gh api --paginate "repos/$REPO/actions/workflows/$workflow/runs?event=pull_request&branch=$BRANCH&per_page=100" \
            --jq ".workflow_runs[] | select(.id < $RUN_ID and .status != \"completed\"
              and .head_repository.full_name == \"$HEAD_REPO\") | .id" |
            while read -r id; do
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null && echo "Cancelled run $id"
            done

  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # a push compares with the last commit this workflow passed on
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
      global: ${{ steps.suites.outputs.global }}
      web: ${{ steps.suites.outputs.web }}
      cli: ${{ steps.suites.outputs.cli }}
      ios: ${{ steps.suites.outputs.ios }}
      docker: ${{ steps.suites.outputs.docker }}
      plugin: ${{ steps.suites.outputs.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: suites
        uses: MaudeCode/.github/actions/ci-suites@418695a65b056488bad5f6a769e49c638832bca9

  global:
    name: global
    needs: changes
    if: needs.changes.outputs.global == 'true'
    uses: ./.github/workflows/global-verify.yml

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-verify.yml

  cli:
    name: cli
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/cli-verify.yml

  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-verify.yml

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker-verify.yml

  plugin:
    name: plugin
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    uses: ./.github/workflows/hermes-plugin-verify.yml

  gate:
    name: CI Gate
    needs: [changes, global, web, cli, ios, docker, plugin]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: MaudeCode/.github/actions/ci-gate@418695a65b056488bad5f6a769e49c638832bca9
        with:
          needs: ${{ toJSON(needs) }}
          selected: ${{ needs.changes.outputs.suites }}
