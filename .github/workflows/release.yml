name: Release
run-name: Release ${{ inputs.tag }}

# Tag-last release (see RELEASES.md in MaudeCode/.github): dispatched with a version and any commit on main after the
# last release, it publishes that commit and creates the tag as its last step. A failed release leaves no tag, and every
# publishing job can run again for the same version from the same commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v1.2.3
        required: true
        type: string
      sha:
        description: Full SHA of the commit on main to release; empty for the head of main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE_NAME: maudecode/cowtail

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to look up checks that already passed
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      checks: ${{ steps.check.outputs.checks }}
    steps:
      - id: check
        uses: MaudeCode/.github/actions/release-preflight@418695a65b056488bad5f6a769e49c638832bca9
        with:
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.sha }}
          # Each suite's jobs, as ci.yml's push run on main names them. A suite that already passed on the commit is
          # reused; the release runs the others below. A suite the push run skipped has no result to reuse.
          checks: |
            ci.yml: global / *
            ci.yml: web / *
            ci.yml: ios / *
            ci.yml: cli / *

  # Fails the release-freeze status on open pull requests that change a workflow file, so none merges mid-release:
  # GitHub refuses this workflow's token when it tags a commit whose workflow files differ from main's. validate needs
  # it, and every publishing job needs validate.
  freeze:
    name: Freeze Workflow Changes
    needs: [preflight]
    runs-on: ubuntu-24.04
    permissions: { statuses: write, pull-requests: read, actions: read }
    steps:
      - uses: MaudeCode/.github/actions/release-freeze@418695a65b056488bad5f6a769e49c638832bca9
        with: { mode: start }

  global-verify:
    needs: [preflight]
    if: "${{ !fromJSON(needs.preflight.outputs.checks)['ci.yml: global / *'] }}"
    uses: ./.github/workflows/global-verify.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  web-verify:
    needs: [preflight]
    if: "${{ !fromJSON(needs.preflight.outputs.checks)['ci.yml: web / *'] }}"
    uses: ./.github/workflows/web-verify.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  ios-verify:
    needs: [preflight]
    if: "${{ !fromJSON(needs.preflight.outputs.checks)['ci.yml: ios / *'] }}"
    uses: ./.github/workflows/ios-verify.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  cli-verify:
    needs: [preflight]
    if: "${{ !fromJSON(needs.preflight.outputs.checks)['ci.yml: cli / *'] }}"
    uses: ./.github/workflows/cli-verify.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
      version: ${{ needs.preflight.outputs.tag }}

  web-docker-build:
    # A skipped verify passed on this commit already; a failed one stops the release.
    if: &verified ${{ !failure() && !cancelled() }}
    needs: [preflight, global-verify, web-verify, ios-verify, cli-verify]
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
      version: ${{ needs.preflight.outputs.tag }}

  cli-build:
    if: *verified
    needs: [preflight, global-verify, web-verify, ios-verify, cli-verify]
    uses: ./.github/workflows/cli-build.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
      version: ${{ needs.preflight.outputs.tag }}

  ios-build:
    if: *verified
    needs: [preflight, global-verify, web-verify, ios-verify, cli-verify]
    uses: ./.github/workflows/ios-build.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
      version: ${{ needs.preflight.outputs.tag }}
    secrets: inherit

  validate:
    name: Validate Artifacts
    if: *verified
    runs-on: ubuntu-latest
    # Every publishing job runs after this one, so a release whose freeze failed publishes nothing.
    needs:
      - preflight
      - freeze
      - global-verify
      - web-verify
      - ios-verify
      - cli-verify
      - web-docker-build
      - cli-build
      - ios-build
    steps:
      - name: Download web Docker amd64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-amd64
          path: docker-amd64

      - name: Download web Docker arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-arm64
          path: docker-arm64

      - name: Download CLI npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-npm-package
          path: cli-npm-package

      - name: Download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ios-ipa

      - name: Resolve iOS IPA path
        id: ios-ipa
        run: |
          ipa_path="$(find ios-ipa -maxdepth 1 -name '*.ipa' -type f | head -n 1)"
          test -n "${ipa_path}"
          echo "path=${ipa_path}" >> "${GITHUB_OUTPUT}"

      - name: Download iOS symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-dsyms
          path: ios-dsyms

      - name: Verify artifacts exist
        run: |
          test -s docker-amd64/image.tar
          test -s docker-arm64/image.tar
          test -s cli-npm-package/*.tgz
          test -s ios-ipa/*.ipa
          test -d ios-dsyms
          tar -tf docker-amd64/image.tar > /dev/null
          tar -tf docker-arm64/image.tar > /dev/null
          tar -tzf cli-npm-package/*.tgz > /dev/null

  # Verifies the IPA ios-build handed over and uploads it. Uploading the same version and build number again is
  # success, so the release can run again; the testflight environment, limited to main, gates it.
  publish-ios:
    name: Publish iOS App
    if: *verified
    runs-on: xcode-27
    needs: [preflight, ios-build, validate]
    environment: testflight
    concurrency:
      group: cowtail-testflight
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ios-ipa

      - name: Resolve iOS IPA path
        id: ios-ipa
        run: |
          ipa_path="$(find "${PWD}/ios-ipa" -maxdepth 1 -name '*.ipa' -type f | head -n 1)"
          test -n "${ipa_path}"
          echo "path=${ipa_path}" >> "${GITHUB_OUTPUT}"

      - uses: MaudeCode/.github/actions/ios-publish@418695a65b056488bad5f6a769e49c638832bca9
        with:
          ipa: ${{ steps.ios-ipa.outputs.path }}
          bundle-id: ${{ secrets.COWTAIL_PRODUCT_BUNDLE_IDENTIFIER }}
          version: ${{ needs.ios-build.outputs.marketing_version }}
          build-number: ${{ needs.ios-build.outputs.build_number }}
          commit: ${{ needs.ios-build.outputs.commit }}
          upload: true
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

  publish-npm:
    name: Publish CLI to npm
    if: *verified
    runs-on: ubuntu-latest
    needs: [preflight, validate]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Check npm for this version
        id: published
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: node script/release/published.mjs npm "$(node -p 'require("./cli/package.json").name')" "${VERSION}" "${SHA}"

      - name: Download CLI npm package
        if: steps.published.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-npm-package
          path: cli-npm-package

      - name: Publish npm package
        if: steps.published.outputs.publish == 'true'
        run: |
          tarball="$(realpath "$(ls cli-npm-package/*.tgz)")"
          echo "Publishing ${tarball}"
          npm publish "${tarball}" --provenance --access public --tag latest

  publish-images:
    name: Publish Web Image (${{ matrix.arch }})
    if: *verified
    runs-on: ubuntu-latest
    needs: [preflight, validate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: script/release
          persist-credentials: false

      # Cone-mode sparse checkout keeps the root files, .node-version among them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the registry for this image
        id: published
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          image="${REGISTRY}/${WEB_IMAGE_NAME}:${{ matrix.arch }}-${TAG}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          node script/release/published.mjs image "${image}" "${SHA}"

      - name: Download image
        if: steps.published.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-${{ matrix.arch }}
          path: docker-${{ matrix.arch }}

      - name: Load and push architecture image
        if: steps.published.outputs.publish == 'true'
        run: |
          load_output="$(docker load -i "docker-${{ matrix.arch }}/image.tar")"
          printf '%s\n' "$load_output"
          image_ref="$(printf '%s\n' "$load_output" | awk -F': ' '/Loaded image/{ref=$2} END{print ref}')"
          test -n "$image_ref"
          docker tag "$image_ref" "${IMAGE}"
          docker push "${IMAGE}"

  publish-image-manifest:
    name: Publish Web Image Manifest
    if: *verified
    runs-on: ubuntu-latest
    needs: [preflight, publish-images]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # publish-images has checked that both architecture images are from this commit. Pointing the version and
      # latest at them again gives the same manifest, so this step can run again.
      - name: Create and push multi-arch manifest
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          image="${REGISTRY}/${WEB_IMAGE_NAME}"
          for tag in "${VERSION}" latest; do
            docker buildx imagetools create -t "${image}:${tag}" "${image}:amd64-${TAG}" "${image}:arm64-${TAG}"
          done

  deploy-convex:
    name: Deploy Convex
    if: *verified
    needs: [preflight, publish-ios, publish-npm, publish-image-manifest]
    uses: ./.github/workflows/convex-deploy.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
    secrets: inherit

  publish-github-release:
    name: Tag and Publish GitHub Release
    if: *verified
    runs-on: ubuntu-latest
    needs: [preflight, publish-ios, publish-npm, publish-images, publish-image-manifest, deploy-convex]
    permissions:
      contents: write
    steps:
      - name: Download CLI npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-npm-package
          path: cli-npm-package

      - name: Create the version tag
        uses: MaudeCode/.github/actions/release-tag@418695a65b056488bad5f6a769e49c638832bca9
        with:
          tag: ${{ needs.preflight.outputs.tag }}
          sha: ${{ needs.preflight.outputs.sha }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          files=(cli-npm-package/*.tgz)
          # A release left by an earlier attempt only needs its assets.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            flags=(--verify-tag --generate-notes)
            if [[ "${PRERELEASE}" == true ]]; then flags+=(--prerelease); fi
            gh release create "${TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}"
          fi

  # Passes the release-freeze status again however the release ended, unless another release is running.
  thaw:
    name: Thaw Workflow Changes
    needs: [freeze, publish-github-release]
    if: always()
    runs-on: ubuntu-24.04
    permissions: { statuses: write, pull-requests: read, actions: read }
    steps:
      - uses: MaudeCode/.github/actions/release-freeze@418695a65b056488bad5f6a769e49c638832bca9
        with: { mode: end }
