# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Convex

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: convex-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Convex
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 15
    env:
      CONVEX_SELF_HOSTED_URL: "${{ vars.CONVEX_SELF_HOSTED_URL }}"
      CONVEX_SELF_HOSTED_ADMIN_KEY: "${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}"
      COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL: "${{ secrets.COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL }}"
      COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN: "${{ secrets.COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate Convex deploy configuration
        run: |
          if [ -z "${CONVEX_SELF_HOSTED_URL}" ]; then
            echo "Missing Actions variable CONVEX_SELF_HOSTED_URL" >&2
            exit 1
          fi

          if [ -z "${CONVEX_SELF_HOSTED_ADMIN_KEY}" ]; then
            echo "Missing Actions secret CONVEX_SELF_HOSTED_ADMIN_KEY" >&2
            exit 1
          fi

          if [ -z "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL}" ]; then
            echo "Missing Actions secret COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL" >&2
            exit 1
          fi

          if [ -z "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN}" ]; then
            echo "Missing Actions secret COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Synchronize Convex function environment
        working-directory: web
        run: |
          bunx convex env set COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL}"
          bunx convex env set COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN}"

      - name: Deploy Convex
        working-directory: web
        run: bunx convex deploy

      - name: Merge duplicate Alertmanager lifecycles
        working-directory: web
        run: bun scripts/migrate-alert-lifecycles.mjs
