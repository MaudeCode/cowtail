# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Convex

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: convex-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Convex
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 15
    env:
      CONVEX_SELF_HOSTED_URL: "${{ vars.CONVEX_SELF_HOSTED_URL }}"
      CONVEX_SELF_HOSTED_ADMIN_KEY: "${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}"
      COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL: "${{ secrets.COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL }}"
      COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN: "${{ secrets.COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate Convex deploy configuration
        run: |
          if [ -z "${CONVEX_SELF_HOSTED_URL}" ]; then
            echo "Missing Actions variable CONVEX_SELF_HOSTED_URL" >&2
            exit 1
          fi

          if [ -z "${CONVEX_SELF_HOSTED_ADMIN_KEY}" ]; then
            echo "Missing Actions secret CONVEX_SELF_HOSTED_ADMIN_KEY" >&2
            exit 1
          fi

          if [ -z "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL}" ]; then
            echo "Missing Actions secret COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL" >&2
            exit 1
          fi

          if [ -z "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN}" ]; then
            echo "Missing Actions secret COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize Convex function environment
        working-directory: web
        run: |
          pnpm exec convex env set COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_URL}"
          pnpm exec convex env set COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN "${COWTAIL_HERMES_ALERT_JOB_WEBHOOK_TOKEN}"

      - name: Deploy Convex
        working-directory: web
        run: pnpm exec convex deploy

      - name: Merge duplicate Alertmanager lifecycles
        working-directory: web
        run: node scripts/migrate-alert-lifecycles.mjs
