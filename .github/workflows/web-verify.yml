name: Web Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "protocol/**"
      - "web/**"
      - ".github/workflows/web-verify.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "protocol/**"
      - "web/**"
      - ".github/workflows/web-verify.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:web
      - run: cd web && pnpm exec tsc -p convex/tsconfig.json --noEmit
      - run: pnpm run build:web
