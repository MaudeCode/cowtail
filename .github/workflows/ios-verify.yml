name: iOS Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "protocol/**"
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-verify.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "protocol/**"
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-verify.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: iOS Verify
    runs-on: xcode-27
    env:
      # setup-ios sets COWTAIL_IOS_TEST_OS to the pinned Xcode's simulator SDK version.
      COWTAIL_IOS_TEST_DEVICE_NAME: iPhone 17
      # A hosted runner's first simulator boot can take minutes.
      COWTAIL_IOS_SIMULATOR_BOOT_TIMEOUT: "600"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-ios
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write iOS verify project env
        run: install -m 600 ios/Config/project.env.example ios/Config/project.env

      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --strict

      - name: Run SwiftFmt
        working-directory: ios
        run: swiftformat --lint .

      - name: Test the iOS 26 import guard
        working-directory: ios
        run: scripts/test-check-ios26-imports.sh

      - name: Reset simulator before unit tests
        working-directory: ios
        run: scripts/reset-simulator.sh

      - name: Run iOS Unit Tests
        run: pnpm run test:ios:unit

      # The hosted image has no iOS 26 simulator, so this static check is CI's proof the app still launches on iOS 26.
      - name: Check the app has no strong iOS 27-only imports
        working-directory: ios
        run: |
          app="$(xcodebuild -project Cowtail.xcodeproj -scheme Cowtail -configuration Debug -sdk iphonesimulator \
            -showBuildSettings -json | jq -er '.[] | select(.target == "Cowtail") | .buildSettings
            | .TARGET_BUILD_DIR + "/" + .WRAPPER_NAME')"
          scripts/check-ios26-imports.sh "${app}"

      # The test script regenerates the OpenAPI sources with the pinned generator. A diff here means the protocol or
      # the generator pin changed without the regenerated sources being committed.
      - name: Check the generated OpenAPI sources are committed
        run: |
          changed="$(git status --porcelain -- ios/CowtailApp/Sources/Generated ios/OpenAPITools)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Run 'cd ios && ./generate.sh' and commit the result."
            exit 1
          fi

      - name: Reset simulator before UI tests
        working-directory: ios
        run: scripts/reset-simulator.sh

      - name: Run iOS UI Tests
        run: pnpm run test:ios:ui
