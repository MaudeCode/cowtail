name: iOS Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "bun.lock"
      - "protocol/**"
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-verify.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "package.json"
      - "bun.lock"
      - "protocol/**"
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-verify.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: iOS Verify
    runs-on: xcode-27
    env:
      COWTAIL_IOS_TEST_DEVICE_NAME: iPhone 17
      # The newest runtime on the hosted image that has this device.
      COWTAIL_IOS_TEST_OS: latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-ios
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Write iOS verify project env
        run: install -m 600 ios/Config/project.env.example ios/Config/project.env

      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --strict

      - name: Run SwiftFmt
        working-directory: ios
        run: swiftformat --lint .

      - name: Reset simulator before unit tests
        working-directory: ios
        run: scripts/reset-simulator.sh

      - name: Run iOS Unit Tests
        run: bun run test:ios:unit

      - name: Reset simulator before UI tests
        working-directory: ios
        run: scripts/reset-simulator.sh

      - name: Run iOS UI Tests
        run: bun run test:ios:ui
