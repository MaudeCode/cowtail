name: iOS Verify

# Called by ci.yml when a change reaches the ios suite, and by the release. Nothing here boots a simulator: the
# logic's tests run in the CowtailKit package on macOS, and the app is only built. ios-sim-verify.yml runs the tests
# that need the app host.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: iOS Verify
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ios
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # SwiftPM's repository cache, which xcodebuild resolves through, and the OpenAPI generator's build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/OpenAPITools/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/OpenAPITools/Package.resolved', 'ios/CowtailKit/Package.resolved', 'ios/project.yml') }}

      - name: Write iOS verify project env
        run: install -m 600 ios/Config/project.env.example ios/Config/project.env

      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --strict

      - name: Run SwiftFmt
        working-directory: ios
        run: swiftformat --lint .

      - name: Test the iOS 26 import guard
        working-directory: ios
        run: scripts/test-check-ios26-imports.sh

      - name: Run the CowtailKit tests on macOS
        working-directory: ios/CowtailKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee "${RUNNER_TEMP}/ios-package-tests.log"

      - name: Check iOS test run times
        run: pnpm exec maudecode-ci test-durations --config script/ci/test-durations.json "${RUNNER_TEMP}/ios-package-tests.log"

      # Compiles the app and its extension for the simulator; nothing is installed or booted.
      - name: Build the app for the iOS simulator
        working-directory: ios
        run: |
          ./generate.sh
          xcodebuild build -project Cowtail.xcodeproj -scheme Cowtail -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64

      # The hosted image has no iOS 26 simulator, so this static check is CI's proof the app still launches on iOS 26.
      - name: Check the app has no strong iOS 27-only imports
        working-directory: ios
        run: |
          app="$(xcodebuild -project Cowtail.xcodeproj -scheme Cowtail -configuration Debug -sdk iphonesimulator \
            -showBuildSettings -json | jq -er '.[] | select(.target == "Cowtail") | .buildSettings
            | .TARGET_BUILD_DIR + "/" + .WRAPPER_NAME')"
          scripts/check-ios26-imports.sh "${app}"

      # generate.sh regenerates the OpenAPI sources with the pinned generator. A diff here means the protocol or
      # the generator pin changed without the regenerated sources being committed.
      - name: Check the generated OpenAPI sources are committed
        run: |
          changed="$(git status --porcelain -- ios/CowtailKit/Sources/CowtailKit/Generated ios/OpenAPITools)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Run 'cd ios && ./generate.sh' and commit the result."
            exit 1
          fi
