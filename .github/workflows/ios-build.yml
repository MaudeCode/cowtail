name: iOS Build

# Signing, the build number, the export and its verification come from the shared actions in MaudeCode/.github (IOS.md
# there); this workflow keeps only what is Cowtail's own: generating the XcodeGen project and archiving it. It never
# uploads: the release's publish-ios job uploads the verified IPA it hands over.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
      version:
        required: true
        type: string
      upload_artifacts:
        required: false
        type: boolean
        default: true
    outputs:
      marketing_version:
        description: The app's marketing version.
        value: ${{ jobs.build.outputs.marketing_version }}
      build_number:
        description: The app's build number.
        value: ${{ jobs.build.outputs.build_number }}
      commit:
        description: The commit the build number belongs to.
        value: ${{ jobs.build.outputs.commit }}
  workflow_dispatch:
    inputs:
      version:
        description: App marketing version, with or without a leading v.
        required: true
        type: string
      upload_artifacts:
        description: Upload the exported IPA and symbols as workflow artifacts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build iOS App
    runs-on: xcode-27
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.number.outputs.build-number }}
      commit: ${{ steps.number.outputs.commit }}
    env:
      BUNDLE_ID: ${{ secrets.COWTAIL_PRODUCT_BUNDLE_IDENTIFIER }}
      # The Notification Service Extension, embedded in the app and signed with its own profile.
      NOTIFICATION_SERVICE_BUNDLE_ID: ${{ secrets.COWTAIL_PRODUCT_BUNDLE_IDENTIFIER }}.NotificationService
      ARCHIVE_PATH: ${{ github.workspace }}/ios/build/ios/Cowtail.xcarchive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ios

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve marketing version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          marketing_version="${VERSION_INPUT#v}"
          if ! [[ "${marketing_version}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid iOS marketing version: ${VERSION_INPUT}" >&2
            exit 1
          fi
          echo "marketing_version=${marketing_version}" >> "${GITHUB_OUTPUT}"

      # A re-run for the same version and commit gets the number it already uploaded.
      - id: number
        uses: MaudeCode/.github/actions/ios-build-number@418695a65b056488bad5f6a769e49c638832bca9
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          version: ${{ steps.version.outputs.marketing_version }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - id: signing
        uses: MaudeCode/.github/actions/ios-signing@418695a65b056488bad5f6a769e49c638832bca9
        with:
          certificate-p12-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          bundle-ids: |
            ${{ env.BUNDLE_ID }}
            ${{ env.NOTIFICATION_SERVICE_BUNDLE_ID }}

      - name: Write iOS project env
        env:
          COWTAIL_DEVELOPMENT_TEAM: ${{ steps.signing.outputs.team-id }}
          COWTAIL_PRODUCT_BUNDLE_IDENTIFIER: ${{ secrets.COWTAIL_PRODUCT_BUNDLE_IDENTIFIER }}
          COWTAIL_PUBLIC_SITE_URL: ${{ secrets.COWTAIL_PUBLIC_SITE_URL }}
          COWTAIL_CONVEX_QUERY_URL: ${{ secrets.COWTAIL_CONVEX_QUERY_URL }}
          COWTAIL_HEALTH_SUMMARY_URL: ${{ secrets.COWTAIL_HEALTH_SUMMARY_URL }}
          COWTAIL_ALERT_WRITE_URL: ${{ secrets.COWTAIL_ALERT_WRITE_URL }}
          COWTAIL_AUTH_SESSION_URL: ${{ secrets.COWTAIL_AUTH_SESSION_URL }}
          COWTAIL_PUSH_REGISTRATION_URL: ${{ secrets.COWTAIL_PUSH_REGISTRATION_URL }}
          COWTAIL_PUSH_UNREGISTRATION_URL: ${{ secrets.COWTAIL_PUSH_UNREGISTRATION_URL }}
          COWTAIL_ROUNDUP_TIMEZONE: ${{ secrets.COWTAIL_ROUNDUP_TIMEZONE }}
          COWTAIL_ASSOCIATED_DOMAIN_DEBUG: ${{ secrets.COWTAIL_ASSOCIATED_DOMAIN_DEBUG }}
          COWTAIL_ASSOCIATED_DOMAIN_RELEASE: ${{ secrets.COWTAIL_ASSOCIATED_DOMAIN_RELEASE }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const example = fs.readFileSync("ios/Config/project.env.example", "utf8");
          const keys = [...example.matchAll(/^([A-Z0-9_]+)=/gm)].map((match) => match[1]);
          const missing = keys.filter((key) => !process.env[key]);
          if (missing.length > 0) {
            console.error(`Missing iOS project values: ${missing.join(", ")}`);
            process.exit(1);
          }
          fs.writeFileSync("ios/Config/project.env", keys.map((key) => `${key}=${process.env[key]}`).join("\n") + "\n", { mode: 0o600 });
          NODE

      - name: Generate iOS project
        working-directory: ios
        run: ./generate.sh

      - name: Archive iOS app
        working-directory: ios
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          APP_PROFILE: ${{ fromJSON(steps.signing.outputs.profiles)[env.BUNDLE_ID] }}
          NOTIFICATION_SERVICE_PROFILE: ${{ fromJSON(steps.signing.outputs.profiles)[env.NOTIFICATION_SERVICE_BUNDLE_ID] }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.number.outputs.build-number }}
        run: |
          xcodebuild archive \
            -project Cowtail.xcodeproj \
            -scheme Cowtail \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            COWTAIL_APP_PROFILE="${APP_PROFILE}" \
            COWTAIL_NOTIFICATION_SERVICE_PROFILE="${NOTIFICATION_SERVICE_PROFILE}" \
            -quiet

      - id: publish
        uses: MaudeCode/.github/actions/ios-publish@418695a65b056488bad5f6a769e49c638832bca9
        with:
          archive: ${{ env.ARCHIVE_PATH }}
          export-options: ${{ steps.signing.outputs.export-options }}
          bundle-id: ${{ env.BUNDLE_ID }}
          version: ${{ steps.version.outputs.marketing_version }}
          build-number: ${{ steps.number.outputs.build-number }}

      - name: Upload iOS IPA
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: ${{ steps.publish.outputs.ipa }}
          retention-days: 7

      - name: Upload iOS symbols
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-dsyms
          path: ${{ steps.publish.outputs.dsyms }}
          retention-days: 7

      - name: Remove iOS project env
        if: always()
        run: rm -f ios/Config/project.env
