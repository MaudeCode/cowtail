name: CLI Verify

# Called by ci.yml when a change reaches the cli suite, and by the release.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: v0.0.0-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: CLI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check CLI
        run: pnpm run check:cli

      - name: Test CLI
        run: pnpm run test:cli --reporter=default --reporter=junit --outputFile.junit="${RUNNER_TEMP}/junit/cli.xml"

      - name: Check CLI test run times
        run: pnpm exec maudecode-ci test-durations --config script/ci/test-durations.json "${RUNNER_TEMP}/junit/cli.xml"

      - name: Verify the packed CLI prints its version
        working-directory: cli
        env:
          COWTAIL_VERSION: ${{ inputs.version || 'v0.0.0-dev' }}
        run: |
          pnpm run build:npm
          tarball="$(npm pack --silent)"
          npm install --global --prefix "${RUNNER_TEMP}/cowtail" "./${tarball}"
          test "$("${RUNNER_TEMP}/cowtail/bin/cowtail" --version)" = "${COWTAIL_VERSION}"
