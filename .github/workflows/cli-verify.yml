name: CLI Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: v0.0.0-dev
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "cli/**"
      - "protocol/**"
      - ".github/workflows/cli-build.yml"
      - ".github/workflows/cli-verify.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "cli/**"
      - "protocol/**"
      - ".github/workflows/cli-build.yml"
      - ".github/workflows/cli-verify.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  verify:
    name: CLI Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check CLI
        run: pnpm run check:cli

      - name: Verify the packed CLI prints its version
        working-directory: cli
        env:
          COWTAIL_VERSION: ${{ inputs.version || 'v0.0.0-dev' }}
        run: |
          pnpm run build:npm
          tarball="$(npm pack --silent)"
          npm install --global --prefix "${RUNNER_TEMP}/cowtail" "./${tarball}"
          test "$("${RUNNER_TEMP}/cowtail/bin/cowtail" --version)" = "${COWTAIL_VERSION}"
