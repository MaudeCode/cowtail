name: CLI Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: v0.0.0-dev
      upload_artifacts:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build CLI Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set npm package version
        working-directory: cli
        env:
          COWTAIL_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.COWTAIL_VERSION.replace(/^v/, "");
          const packageJsonPath = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Pack CLI npm package
        working-directory: cli
        env:
          COWTAIL_VERSION: ${{ inputs.version }}
        run: |
          pnpm run build:npm
          npm pack

      - name: Upload CLI npm artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-npm-package
          path: cli/*.tgz
          retention-days: 1
