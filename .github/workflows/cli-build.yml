name: CLI Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: v0.0.0-dev
      upload_artifacts:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build CLI Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set npm package version
        working-directory: cli
        env:
          COWTAIL_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.COWTAIL_VERSION.replace(/^v/, "");
          const packageJsonPath = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Pack CLI npm package
        working-directory: cli
        env:
          COWTAIL_VERSION: ${{ inputs.version }}
        run: |
          pnpm run build:npm
          npm pack

      - name: Upload CLI npm artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-npm-package
          path: cli/*.tgz
          retention-days: 1
