name: Docker Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: dev
      dockerfile:
        required: false
        type: string
        default: web/Dockerfile
      artifact_prefix:
        required: false
        type: string
        default: docker
      image_name:
        required: false
        type: string
        default: cowtail
      upload_artifacts:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # A plain image manifest: the docker exporter takes no attestations.
          provenance: false
          context: .
          file: ${{ inputs.dockerfile }}
          tags: local/${{ inputs.image_name }}:${{ matrix.arch }}-${{ inputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
          build-args: |
            COWTAIL_VERSION=${{ inputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.arch }}
          path: /tmp/image.tar
          retention-days: 1
