name: Docker Verify

# Called by ci.yml when a change reaches the docker suite. The image's own build installs the workspace with
# pnpm install --frozen-lockfile, so the job needs no Node of its own.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty for the commit the run is on.
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: dev
      web_artifact_prefix:
        required: false
        type: string
        default: docker
      upload_artifacts:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-docker-build:
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version || 'dev' }}
      artifact_prefix: ${{ inputs.web_artifact_prefix || 'docker' }}
      upload_artifacts: ${{ inputs.upload_artifacts || false }}
