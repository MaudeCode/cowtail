# Shared by ios-verify.yml and ios-build.yml, which run on GitHub's hosted Xcode image.
name: Set up iOS tools
description: Select the pinned Xcode and install the tools the iOS project scripts call.
inputs:
  xcode-version:
    description: The Xcode major.minor every iOS job builds with.
    required: false
    default: "27.2"
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ inputs.xcode-version }}

    # Fails unless the pin was selected; there is no fallback to another Xcode. Tests run on the simulator runtime that
    # matches the pinned SDK, never a newer one the image adds later.
    - name: Check the Xcode version and pick the simulator runtime
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.xcode-version }}
      run: |
        set -euo pipefail
        # Read all output: `| head -n 1` closes the pipe early and xcodebuild aborts on the broken pipe.
        actual="$(xcodebuild -version)"
        actual="${actual%%$'\n'*}"
        [[ "${actual}" == "Xcode ${XCODE_VERSION}" || "${actual}" == "Xcode ${XCODE_VERSION}."* ]] \
          || { echo "::error::Requested Xcode ${XCODE_VERSION} but xcodebuild reports '${actual}'"; exit 1; }
        xcodebuild -version
        echo "COWTAIL_IOS_TEST_OS=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "${GITHUB_ENV}"

    - name: Install XcodeGen, SwiftLint and SwiftFormat
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: brew install --quiet xcodegen swiftlint swiftformat
